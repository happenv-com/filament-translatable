name: "Run Tests"

on:
  push:
    branches: [5.x, 4.x]
  pull_request:
    branches: [5.x, 4.x]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.4, 8.3]
        # Filament releases before 4.13.3 / 5.8.3 do not bind Livewire's DataStore as a singleton,
        # which breaks rendering schemas in Livewire tests (filamentphp/filament#20515).
        filament: ['^4.13.3', '^5.8.3']
        stability: [prefer-lowest, prefer-stable]
        # The lowest dependencies predate PHP 8.4/8.5 and emit deprecations there.
        exclude:
          - php: 8.5
            stability: prefer-lowest
          - php: 8.4
            stability: prefer-lowest

    name: P${{ matrix.php }} - F${{ matrix.filament }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --with-all-dependencies

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
