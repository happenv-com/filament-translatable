# Three ecosystems: GitHub Actions, Composer and npm. Minor and patch bumps are
# merged by dependabot-auto-merge.yml — only once every other check on the PR
# has passed. Major bumps are left for a human.
#
# `cooldown` 7 days: a freshly published version waits a week before Dependabot
# proposes it. That is usually enough for a compromised or broken release to be
# pulled before it reaches us unreviewed. .npmrc applies the same rule to
# `npm install` (`min-release-age=7`).
#
# Groups bundle minor and patch bumps into ONE PR per ecosystem per week. Majors
# are left out of the groups on purpose — each arrives on its own, reviewable.
#
# `commit-message`: PR titles must follow Conventional Commits (pr-title.yml),
# so Dependabot titles its PRs `chore(deps): ...`.
version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      composer:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      npm:
        update-types:
          - 'minor'
          - 'patch'
